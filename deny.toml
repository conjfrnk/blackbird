# cargo-deny config. Paired with `cargo audit` (RustSec advisories) in
# CI: `cargo audit` catches known vulnerabilities, `cargo deny` catches
# license drift and dependency policy issues that wouldn't trip the
# advisory DB.
#
# Run locally:
#   cargo install cargo-deny --locked
#   cargo deny check
#
# CI runs in `.github/workflows/ci.yml` Rust job, after tests.

[licenses]
# Allow only licenses that are compatible with Blackbird's MIT licence
# (no GPL-style copyleft in dependencies, no "anti-commons" clauses).
# The list is the permissive-and-compatible subset — extend only with
# a reviewed rationale for each new entry.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    # MPL-2.0 is weakly copyleft at the file level — static linking
    # doesn't infect our code. Terminal emulators with MIT roots
    # commonly ship MPL deps (Alacritty, WezTerm). The specific MPL
    # files retain their licence and we comply by distributing source
    # on request; Blackbird's own code stays MIT.
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Multiple-versions check catches accidental dep duplication from a
# non-unified lockfile. Warn (not deny) — alacritty_terminal pulls in
# a couple of version-split crates that are upstream choices.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Delegated to `cargo audit` — don't duplicate here. `cargo deny`'s
# advisories check is useful when `cargo audit` isn't installed; in
# CI both run.
yanked = "warn"

[sources]
# Only crates.io. No git-URL deps, no private registries — anything
# else should be called out in review rather than land silently.
unknown-registry = "deny"
unknown-git = "deny"
