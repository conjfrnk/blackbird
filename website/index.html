<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackbird</title>
    <meta name="description" content="Blackbird — a fast native macOS terminal." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#282828" />
    <link rel="canonical" href="https://blackbird-terminal.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blackbird" />
    <meta property="og:description" content="A fast native macOS terminal." />
    <meta property="og:url" content="https://blackbird-terminal.com/" />
    <meta property="og:image" content="https://blackbird-terminal.com/icon-512.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #282828;
        color: #EBDBB2;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      img.icon {
        width: 256px;
        height: 256px;
        display: block;
        margin: 0 auto 28px;
        image-rendering: -webkit-optimize-contrast;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #EBDBB2;
      }
      @media (max-width: 480px) {
        img.icon { width: 192px; height: 192px; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icon-512.png" alt="Blackbird app icon" width="512" height="512" />
      <h1>Blackbird</h1>
    </main>
  </body>
</html>
