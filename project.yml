# project.yml is the authoritative source for Blackbird.xcodeproj.
# `scripts/build-core.sh` and CI re-run `xcodegen generate` on every
# invocation, and CI fails if the regeneration produces a pbxproj diff
# (xcode-project F1 gate). Never edit Blackbird.xcodeproj/project.pbxproj
# by hand — your change will be overwritten on the next generate pass.
# To add a source file, resource, target, or build setting, edit this
# file and re-run `xcodegen generate`.

name: Blackbird
options:
  bundleIdPrefix: dev.conjfrnk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    DEAD_CODE_STRIPPING: YES
    # Targeted strict-concurrency surfaces Sendable warnings on code that
    # has explicit @Sendable / actor annotations (MainWindowController,
    # PTY read pumps, ThemeManager) without screaming at every legacy
    # call site. `complete` is a later bar; `minimal` (the Xcode default)
    # silenced actual races in the past. Audit xcode-project F8.
    SWIFT_STRICT_CONCURRENCY: targeted
    # scripts/build-core.sh (the preBuildScripts entry below) `cd`s out of
    # SRCROOT and invokes cargo, which the script sandbox blocks. Explicit
    # NO with a comment is better than leaving the key unset — Xcode
    # otherwise logs a recommendation on every generate that ends up in
    # CI logs. Audit xcode-project F9.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Blackbird:
    type: application
    platform: macOS
    sources:
      - path: Sources/Blackbird
        excludes:
          - Resources/**
      - Sources/BBCore
      - Sources/Renderer
      - path: Sources/Blackbird/Resources/Fonts
        buildPhase: resources
        type: folder
        optional: false
      - path: Sources/Blackbird/Resources/Terminfo/kitty.terminfo
        buildPhase: resources
      - path: Sources/Blackbird/Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/Blackbird/Resources/shell/osc133.bash
        buildPhase: resources
      - path: Sources/Blackbird/Resources/shell/osc133.fish
        buildPhase: resources
      - path: Sources/Blackbird/Resources/shell/osc133.zsh
        buildPhase: resources
    preBuildScripts:
      - name: Build Rust core
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/build-core.sh"
        inputFiles:
          - $(SRCROOT)/core/Cargo.toml
          - $(SRCROOT)/core/src/lib.rs
          - $(SRCROOT)/core/cbindgen.toml
          - $(SRCROOT)/core/build.rs
        outputFiles:
          - $(SRCROOT)/core/target/universal/release/libblackbird_core.a
          - $(SRCROOT)/core/include/BBCore.h
    info:
      path: Sources/Blackbird/Info.plist
      properties:
        CFBundleName: Blackbird
        CFBundleDisplayName: Blackbird
        CFBundleShortVersionString: "0.2.2"
        # Monotonic build number. This is the value Sparkle's appcast
        # `<sparkle:version>` compares against when deciding if an update is
        # newer. It MUST increase every release — Sparkle compares
        # component-wise, so an unbumped "1" vs a shipped "0.1.2" evaluates
        # as 1 > 0 and hides the update ("you're up to date"). Fine so long
        # as cut-release.sh owns the bump.
        CFBundleVersion: "20"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Connor Frank. MIT License."
        # Shells keep state (cwd, env, scrollback, in-flight writes). Opting
        # into automatic/sudden termination lets macOS kill Blackbird without
        # delivering a close event, leaving child processes to die mid-write.
        # Matches Terminal.app / iTerm2 for this reason.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSApplicationCategoryType: public.app-category.developer-tools
        # macOS auto-registers every font under Contents/Resources/Fonts at
        # app launch — no runtime CTFontManagerRegister* calls needed. Pair
        # this with the Fonts folder listed under `sources` so xcodegen
        # copies them into Resources during the build.
        ATSApplicationFontsPath: Fonts/
        # Classic .icns ships all 10 sizes (16–1024). We tried the modern
        # xcassets pathway; Xcode's actool compiled Assets.car fine but also
        # wrote a stripped Contents/Resources/AppIcon.icns with only sizes up
        # to 256, which Stage Manager resolved over the catalog and rendered
        # as a generic tile when asking for 512+. A prebuilt full .icns sidesteps it.
        CFBundleIconFile: AppIcon
        # Terminal emulators are common AppleScript / osascript targets;
        # macOS 11+ under the hardened runtime requires this key to be
        # present or TCC silently blocks all Apple Events with
        # errAEEventNotPermitted (-1743). No Apple Events code exists in
        # the tree today, but the string is present so a future
        # tab-scripting / CLI-helper addition doesn't need to touch
        # Info.plist. Audit xcode-project F5.
        NSAppleEventsUsageDescription: "Blackbird uses Apple Events to coordinate with scripts you run from a terminal session."
        SUFeedURL: https://blackbird-terminal.com/appcast.xml
        SUPublicEDKey: c0owV2OCS9djxEodLrUloctbMw+qQl52pVkZDuT8fV4=
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
        # Keep the privileged InstallerLauncher XPC service OFF until a
        # real signed appcast (non-placeholder SUFeedURL + non-empty
        # SUPublicEDKey) ships. Sparkle registers a root-level helper
        # when this is true; with the current placeholder feed the
        # updater never runs, so we don't need the surface live.
        SUEnableInstallerLauncherService: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.conjfrnk.blackbird
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/Sources/BBCore
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/core/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/core/target/universal/release
        # Pin manual Developer-ID signing so Archive from Xcode's UI
        # behaves the same as `scripts/release.sh`. Without this the
        # Archive action attempts automatic signing against whatever
        # Apple Developer account is logged into Xcode — fine for local
        # dev but surprising for a contributor expecting the UI path to
        # produce a notarizable build. scripts/release.sh still overrides
        # CODE_SIGN_IDENTITY with "$DEVELOPER_ID" on the command line,
        # which takes precedence. Audit xcode-project F11.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: F2B95Q4CT8
        CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - package: Sparkle

  BlackbirdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BlackbirdTests
    dependencies:
      - target: Blackbird
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Blackbird.app/Contents/MacOS/Blackbird
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/Sources/BBCore
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/core/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/core/target/universal/release

schemes:
  Blackbird:
    build:
      targets:
        Blackbird: all
        BlackbirdTests: [test]
    test:
      config: Debug
      targets: [BlackbirdTests]
      gatherCoverageData: false
      disableMainThreadChecker: false
      enableAddressSanitizer: true
      enableUBSanitizer: true
    run:
      config: Debug
      disableMainThreadChecker: false
      enableAddressSanitizer: true
      enableUBSanitizer: true
    archive:
      config: Release
