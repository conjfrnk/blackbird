# Auto-update third-party GitHub Actions so moving tags (@v4, @stable, etc.)
# are surfaced as PRs rather than pulling in whatever landed upstream since
# the last manual update. The audit (docs-meta F5) flagged actions/checkout@v4
# + dtolnay/rust-toolchain@stable + Swatinem/rust-cache@v2 as supply-chain
# exposure; this is the lighter-weight alternative to pinning every action
# to a specific SHA.
#
# Cargo and Swift package deps are pinned (Cargo.lock / Package.resolved);
# `cargo audit` catches advisories but nothing surfaced ordinary updates, so
# those ecosystems get a monthly channel too (Cargo.lock last moved by hand
# on 2026-06-30).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - swift
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
