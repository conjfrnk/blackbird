name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v0.1.0)
        required: true

# Workflow default: read-only. The release job opts into contents:
# write explicitly so a compromised checkout-adjacent action cannot
# create or force-push a release.
permissions:
  contents: read

jobs:
  release:
    name: Build, sign, notarize, publish DMG
    runs-on: macos-15
    permissions:
      contents: write      # needed to create/upload to releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For manual workflow_dispatch, check out the tag the user specified.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-bin: 'false'

      - name: Select Xcode 16.4
        # Newest Xcode 16 on the macos-15 image (macOS 15 SDK — the SDK
        # release DMGs are built against). See the matrix jobs for the
        # Xcode 26 leg.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # --- Codesigning setup ---
      # All three secrets below are optional. If missing, we produce an
      # unsigned DMG and skip notarization — useful for dry-run tags.
      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Capture the identity string for release.sh.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Clear the SwiftPM checkout cache
        # The "already exists in file system" exit 74 at `xcodebuild archive`
        # was a stale shared SwiftPM checkout colliding with the Sparkle
        # artifact; release.sh now clones packages under dist/ and this
        # removes the shared cache the runner image may carry.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData/*/SourcePackages || true

      - name: Build, sign, package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          # A tag build MUST be signed + notarized. The old fallback
          # ("secrets absent — producing unsigned DMG") would have uploaded
          # an unsigned DMG as a public, non-draft release the day a secret
          # expired or was rotated away; release.sh's codesign gate was the
          # only thing standing in the way. Fail loud instead.
          for v in APPLE_ID APP_SPECIFIC_PASSWORD TEAM_ID DEVELOPER_ID; do
            if [ -z "${!v:-}" ]; then
              echo "error: $v is empty — refusing to build an unsigned release DMG" >&2
              exit 1
            fi
          done
          scripts/release.sh notarize

      - name: Stage DMGs (versioned + stable alias)
        id: dmg
        run: |
          set -euo pipefail
          VERSIONED=$(ls dist/Blackbird-*.dmg | head -1)
          # Stable alias so the website's "Download for macOS" button can
          # link to /releases/latest/download/Blackbird.dmg without knowing
          # the tag.
          cp "$VERSIONED" dist/Blackbird.dmg
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"
          echo "stable=dist/Blackbird.dmg" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        # cut-release.sh refuses to tag a version without a CHANGELOG
        # section, so this is only empty for tags cut by hand. Fall back
        # to GitHub's auto-generated notes rather than an empty body.
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if scripts/changelog-section.sh "$TAG" > "$RUNNER_TEMP/notes.md"; then
            echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no section for $TAG — using auto-generated notes"
            : > "$RUNNER_TEMP/notes.md"
            echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMGs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.dmg.outputs.versioned }}
            ${{ steps.dmg.outputs.stable }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.notes.outputs.generate }}
