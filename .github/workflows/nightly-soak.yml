# Nightly soak — heavy memory / RSS / FD / leak gates that don't run on PR CI.
#
# Why this workflow exists
# ------------------------
# Connor's launch is 2026-07-01. A user running Blackbird as their daily
# driver opens a tab in the morning and expects the same shell session
# to be there at end of day — sometimes the next day. A 0.1 MiB/iter
# Combine retain bug or a slow-leaked dispatch source is invisible at
# PR-CI horizons (the rust-memory job tops out at 128 iterations on the
# Rust side; the Swift side was unmeasured before P1.5). It would only
# surface as user reports of "Blackbird memory crept up over the day."
#
# Phase 1 + Phase 2 of the v0.2 hardening plan landed gates capable of
# catching those leaks, but we deliberately scoped them OUT of PR CI:
#   - Rust gates (`#[ignore]`-annotated, opt-in via `cargo test --
#     --ignored`): release-only, serial, ~5 min wall each. Inflating
#     PR feedback by 20 min for a class of bug that a nightly will
#     catch within 24 h is bad economics for the merge loop.
#   - Swift soak gates (env-gated `BB_RUN_SOAK=1`): same
#     reasoning — per-iter dispatch-queue teardown chatter doesn't
#     earn its keep on a per-PR basis.
# This workflow is the place those gates run. Once-a-day cadence keeps
# the signal fresh enough to bisect against the day's commits, without
# burning runner minutes on every push.
#
# Gates this workflow covers
# --------------------------
# Rust (rust-soak job):
#   1. long_session_memory   — RSS gate over 128 new/free + churn cycles
#   2. long_session_resources — FD + thread count return-to-baseline
#                                over 1024 cycles (P2.5 gate)
#   3. sweep_soak_60s         — 60-second escape-byte fuzz against a
#                                live BBTerm to find protocol-level
#                                state corruption that fast suites miss
#   4. throughput             — parser MB/s floor (also runs on PR CI
#                                under rust-throughput; re-running
#                                here gives a daily trend signal on
#                                the same hardware class)
# Swift (swift-soak job):
#   5. SwiftSessionRSSReturnsToBaselineTests (BB_RUN_SOAK=1) — the
#      P1.5 Swift counterpart to the Rust long_session_memory gate.
#      32 iterations of {create headless session, feed 1 MiB,
#      terminate} with absolute + delta-of-deltas RSS checks.
#   6. BBTermAdversarialTests::test_soak_10s_feedAndSnapshot
#      (BB_RUN_SOAK=1) — the existing 10-second feed-and-snapshot soak
#      with first-second / final peak ratio bound.
#   7. MultiTabConcurrentSoakTests + SingleSessionSteadyStateLeakTests
#      (BB_RUN_SOAK=1) — the 6-session fan-out RSS / main-thread-gap gate
#      and the single-session 1 MiB steady-state / snapshot-churn drift
#      gates. They sat behind the same gate but in no -only-testing list,
#      so they ran in no job at all.
#   8. RealLatencyProbeWindowedTests (BB_RUN_LATENCY_PROBE=1) — the
#      P4.6 honesty fix. The PR-CI `latency-gate` job (ci.yml) only
#      pins the LatencyProbe log-line FORMAT — the synthetic harness
#      it runs measures back-to-back ~0 µs deltas, not real latency.
#      This test creates a real NSWindow + MTKView, synthesizes
#      keyDown events through NSApp.sendEvent, pumps the runloop
#      until frames present, and asserts max sample > 0.5 ms (real
#      frame latency, not the synthetic harness's ~0 µs floor).
#      Canonical real-world keypress→pixel latency measurement.
#   9. The eleven BB_RUN_WINDOW_LIFECYCLE_TESTS=1 real-window tests (F-S6-001
#      dock zombie, tabbingMode revert, band-click tab hijack, pill
#      accessibility frames, close-confirm bypass, core-failure keep-open,
#      joined-tab release, close-selected-tab neighbour x4) — each in its OWN xcodebuild process, because
#      two real windows / merged tab groups in one xctest host crash it.
#
# Env-propagation hazard (load-bearing — read this before editing)
# ----------------------------------------------------------------
# `xcodebuild test` does NOT propagate the calling shell's environment
# to the xctest host process by default. If we naively wrote
# `BB_RUN_SOAK=1 xcodebuild test ...`, ProcessInfo.processInfo.environment
# inside the test process would not see BB_RUN_SOAK, the
# `XCTSkipIf(env["BB_RUN_SOAK"] != "1", ...)` guard at the top of
# `SwiftSessionRSSReturnsToBaselineTests.swift:130` would fire, the
# soak tests would skip silently, and the workflow would go green
# while covering nothing — exactly the silent-failure mode this
# workflow exists to prevent.
#
# The canonical, documented mechanism (xcodebuild(1) man page, "TEST_RUNNER_<VAR>"):
#   TEST_RUNNER_BB_RUN_SOAK=1 xcodebuild test ...
#   -> xctest sees env["BB_RUN_SOAK"] == "1" (prefix stripped).
# We use this form below. It is independent of any project.yml
# scheme-level env config and works on Xcode 16.4 and 26.6 (the
# versions ci.yml's two legs pin; swift-soak below uses 26.6, the
# toolchain that release DMGs ship with).
#
# Belt-and-braces: the final step of the swift-soak job greps the
# captured xcodebuild log for evidence the soak tests actually RAN
# (not skipped). xcodebuild emits a deterministic
# `Test Case '-[...] passed` line for each successful test. If
# TEST_RUNNER_<VAR> propagation broke (Xcode regression, scheme
# rewrite, runner-image drift), the test would skip — yielding a
# `Test Case ... skipped (BB_RUN_SOAK=1 not set; ...)` line instead.
# We grep for the passed marker and fail the job loudly if it's
# missing, preventing a silent green.
#
# How to add a new gate
# ---------------------
# Rust: add a `#[ignore]`-annotated test under core/tests/, then add
# a single line to the rust-soak `Run` step matching the existing
# `cargo test -p blackbird_core --release --test <name> -- --ignored
# --nocapture --test-threads=1` shape. No env vars needed; the
# `--ignored` flag is the gate.
# Swift: add `try XCTSkipIf(env["BB_<NAME>"] != "1", ...)` at the top
# of the test function, then in this workflow:
#   1. Add `TEST_RUNNER_BB_<NAME>=1 \` to the `xcodebuild test`
#      invocation in the swift-soak job.
#   2. Append `-only-testing:BlackbirdTests/<TestClassName>` if
#      it's in a new test class.
#   3. Update the sentinel grep to expect a passed line from the
#      new test class as well (or rely on the existing
#      class-coverage; the marker already verifies the workflow
#      isn't silently skipping ALL soak tests).

name: Nightly - soak / leak gates

on:
  # 07:00 UTC = 03:00 EDT / 00:00 PDT. Picked one hour after
  # nightly-miri (06:00 UTC) so the two heavy nightlies don't
  # contend for hosted-macOS runner availability when GitHub's hosted
  # runner pool is tight. Both finish well within their 60-min
  # caps, so even back-to-back start times wouldn't actually
  # collide on runner allocation - but staggering keeps the
  # signal-to-noise on per-job timing clean if we ever start
  # measuring runner-startup latency as a regression signal.
  schedule:
    - cron: "0 7 * * *"
  # Manual trigger so we can verify the workflow on demand after
  # touching gate code (e.g. tightening a tolerance or adding a
  # new soak test) without waiting overnight for the next run.
  workflow_dispatch:

# Read-only by default - same posture as ci.yml and nightly-miri.yml.
# This workflow is pure verification; no need for any write scope.
permissions:
  contents: read

# A second push to the same branch (or a manual re-trigger) cancels
# the in-flight run. Saves runner minutes - the previous run's
# signal is stale. Mirrors nightly-miri.yml.
concurrency:
  group: nightly-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-soak:
    name: Rust - long-session memory + resource + sweep soak gates
    runs-on: macos-15
    # Per-job 60-min cap. Empirically each `--ignored` gate runs
    # 1-5 min on macos-15; the 60 s sweep_soak_60s adds 60 s wall;
    # total wall is well under 30 min. 60 min is headroom for a
    # nightly toolchain regression that slows release-mode codegen
    # or for runner-image churn on cargo cache hydrate. If this
    # ever times out, investigate the slowdown - don't bump the cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Same toolchain as ci.yml's `rust` and `rust-memory`
        # jobs (1.85.0). Mismatching channels between PR CI and
        # nightly soak risks a regression that only reproduces
        # on one channel - defeats the bisect signal.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        # Shared cache key with ci.yml so the rust-memory and
        # rust-resources PR-CI jobs warm this nightly's cache
        # (and vice versa). Cache hits keep wall under 5 min
        # for the toolchain + crates-index + target/ hydration.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-bin: 'false'

      # The four gates run sequentially as separate steps so we
      # see all results in the GHA timeline as separate timing
      # rows, and so a single early failure surfaces immediately
      # rather than waiting through the rest of the suite.
      # `--release` matches the PR CI rust-memory + rust-resources
      # jobs exactly - the gates were tuned against release-mode
      # codegen and would have different RSS / timing baselines
      # under debug.
      #
      # `--test-threads=1` on the memory + resources + sweep_soak
      # gates: parallel runs would cross-contaminate process-wide
      # RSS / FD / thread-list measurements. Throughput is
      # CPU-bound and benefits from parallel; we omit the flag
      # there.
      - name: Run long-session memory gate
        # Rust counterpart of the Swift session-drop test below.
        # Asserts new/input/snapshot/free + snapshot-churn loops
        # don't leak RSS via mach_task_basic_info. See
        # core/tests/long_session_memory.rs for the absolute
        # 32 MiB cap + delta-of-deltas idiom.
        run: cargo test -p blackbird_core --release --test long_session_memory -- --ignored --nocapture --test-threads=1

      - name: Run long-session FD + thread gate
        # P2.5: catches leaks that wouldn't show as RSS growth -
        # a `mem::forget`-ed File or per-BBTerm worker thread
        # that burns FDs / threads cycle-by-cycle until the
        # process hits ulimit -n. Asserts return-to-baseline
        # over 1024 bb_term_new/free cycles.
        run: cargo test -p blackbird_core --release --test long_session_resources -- --ignored --nocapture --test-threads=1

      - name: Run 60s sweep soak
        # P1.6: 60-second escape-byte fuzz against a live BBTerm.
        # Catches protocol-level state corruption that the fast
        # `sweep_probe` suite (run on PR CI) doesn't have wall
        # budget for. Renamed from sweep_soak.rs in P1.6.
        run: cargo test -p blackbird_core --release --test sweep_soak_60s -- --ignored --nocapture --test-threads=1

      - name: Run parser throughput gate (trend signal)
        # Already runs on PR CI under `rust-throughput`. Re-running
        # here on the same once-a-day cadence on the same hardware
        # class gives a clean trend dataset for "is throughput
        # silently regressing?" - bisecting throughput drift across
        # PR-CI runs is messy because PR runs vary by branch +
        # baseline + cache state. The nightly run is comparable
        # day-over-day. Cheap (under 30 s wall), so no reason to
        # skip it for cost.
        run: cargo test -p blackbird_core --release --test throughput -- --ignored --nocapture

  swift-soak:
    name: Swift - RSS-returns-to-baseline + 10s feed/snapshot soak
    # macos-26 / Xcode 26.6 since v0.8.1: the toolchain that release DMGs
    # ship with, so RSS / soak numbers describe the binary users run.
    # xcode-27 is GitHub's per-Xcode image that runs macOS 27 itself:
    # RealLatencyProbeWindowedTests is the only place a real NSWindow +
    # MTKView presents frames on CI, so this leg is the nightly's macOS 27
    # rendering signal. rust-soak above is Xcode-independent and stays on
    # macos-15.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    # 60-min cap - see rust-soak for rationale. Swift soak is
    # ~10 min wall (toolchain + xcodegen + universal core build +
    # xcodebuild test for the soak classes including 32x1 MiB
    # session iterations + 10 s adversarial soak, plus seven
    # one-process window-lifecycle runs); 60 min is
    # headroom for runner-image churn on Xcode select / brew install.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Needed to build libblackbird_core.a for the Swift link
        # step. Same toolchain pin as ci.yml's xcode job.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-bin: 'false'

      - name: Select Xcode (per runner image)
        # macos-26: same Xcode pin as release.yml and ci.yml's macos-26 leg.
        # Xcode version drift between the soak and the shipped build risks
        # a Swift compiler change that only reproduces on one - and would
        # defeat the nightly soak's bisect signal. xcode-27: the image's
        # Xcode 27 (macOS 27 SDK), mirroring ci.yml's xcode-27 leg.
        run: |
          case "${{ matrix.os }}" in
            macos-26) sudo xcode-select -s /Applications/Xcode_26.6.app ;;
            xcode-27) sudo xcode-select -s /Applications/Xcode_27.0.app ;;
            *) echo "unexpected runner ${{ matrix.os }}" >&2; exit 1 ;;
          esac
          xcodebuild -version

      - name: Ensure Metal toolchain
        # Mirrors ci.yml: Xcode 26+ ships the Metal compiler as a separate
        # download; no-op when already present. The script polls after the
        # download (see ci.yml) because the toolchain becomes runnable a
        # few seconds after `xcodebuild -downloadComponent` returns.
        run: scripts/ensure-metal-toolchain.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Mirror ci.yml's drift gate exactly. The pbxproj is
        # tracked in git AND auto-generated; without this gate a
        # PR that updates only one would silently diverge the two,
        # and the nightly is one of the places that divergence
        # would surface (different test set selected, different
        # link order, etc).
        run: |
          xcodegen generate
          if ! git diff --quiet -- Blackbird.xcodeproj/project.pbxproj; then
            echo "error: Blackbird.xcodeproj/project.pbxproj drifted from project.yml -" >&2
            echo "       re-run \`xcodegen generate\` locally and commit the diff." >&2
            git --no-pager diff -- Blackbird.xcodeproj/project.pbxproj >&2
            exit 1
          fi

      - name: Build Rust core (universal)
        run: scripts/build-core.sh

      - name: xcodebuild test - soak suites only
        # See header for the env-propagation hazard. Summary:
        # `xcodebuild test` does NOT pass the calling shell's env
        # to the xctest host. The `TEST_RUNNER_<VAR>` shape is the
        # documented (xcodebuild(1) man page) mechanism: xcodebuild
        # strips the `TEST_RUNNER_` prefix and injects the variable
        # into the test runner's environment. Confirmed working
        # on Xcode 16.4 and 26.6.
        #
        # BB_RUN_SOAK gates ALL the Swift soak suites
        # (SwiftSessionRSSReturnsToBaselineTests,
        # MultiTabConcurrentSoakTests, SingleSessionSteadyStateLeakTests
        # and BBTermAdversarialTests::test_soak_10s_*), so the single test
        # action covers every Swift soak gate - provided each class is
        # named in the -only-testing list below.
        #
        # `-only-testing` filters to the named soak test classes only;
        # without this filter we'd run the entire 900+ test PR-CI
        # suite (which is what ci.yml exists for). The nightly soak
        # is exclusively for the env-gated and `#[ignore]`-gated
        # tests that PR CI deliberately skips.
        #
        # CODE_SIGNING_ALLOWED=NO and the empty CODE_SIGN_IDENTITY
        # mirror ci.yml/scripts/test.sh - the runner has no
        # code-signing identity and doesn't need one for xctest.
        #
        # ASan / UBSan are explicitly OFF here for the same reason
        # they're off on ci.yml's xcode job: the scheme enables
        # them by default (project.yml:181-187) and the cumulative
        # ASan instrumentation overhead at xctest-bundle load time
        # has tripped the hosted runner's VM-mapping ceiling (macos-15;
        # macos-26 is assumed to share it).
        # Soak tests do NOT need ASan - the gates here are about
        # RSS leakage, FD / thread leakage, and cumulative state
        # corruption. ASan catches different bugs (heap UB, OOB
        # reads); those are covered by ci.yml's debug + release
        # cargo test runs and by the nightly miri job for the
        # FFI re-entry surface.
        #
        # `set +e` / result-based check: same infra-quirk
        # absorption as ci.yml - the hosted runner occasionally
        # exits the test host with a phantom non-zero on a
        # successful pass. We trust the test-result lines in the
        # log, not the xcodebuild exit code. See ci.yml lines
        # 152-188 for the full rationale; the same pattern is
        # safe here because the sentinel-grep step BELOW provides
        # a stronger correctness check than the exit code.
        #
        # BB_RUN_LATENCY_PROBE=1 (P4.6 honesty fix, 2026-05-09): gates
        # `RealLatencyProbeWindowedTests`, the canonical real-world
        # keypress→pixel latency measurement. The test creates a real
        # NSWindow + MTKView, synthesizes NSEvent.keyDown events, pumps
        # the runloop until frames present, and asserts the LatencyProbe
        # collected non-trivial samples (max > 0.5 ms — i.e. real frame
        # latency, not the back-to-back ~0 µs deltas the PR-CI gate
        # measures). PR CI runs the synthetic format-pin only. See the
        # comment block above the `latency-gate` job in ci.yml for the
        # split rationale.
        run: |
          set +e
          TEST_RUNNER_BB_RUN_SOAK=1 \
          TEST_RUNNER_BB_RUN_LATENCY_PROBE=1 \
          xcodebuild test \
            -project Blackbird.xcodeproj \
            -scheme Blackbird \
            -destination "platform=macOS,arch=arm64" \
            -only-testing:BlackbirdTests/SwiftSessionRSSReturnsToBaselineTests \
            -only-testing:BlackbirdTests/MultiTabConcurrentSoakTests \
            -only-testing:BlackbirdTests/SingleSessionSteadyStateLeakTests \
            -only-testing:BlackbirdTests/BBTermAdversarialTests/test_soak_10s_feedAndSnapshot_underBoundedMemory \
            -only-testing:BlackbirdTests/RealLatencyProbeWindowedTests \
            -enableAddressSanitizer NO \
            -enableUndefinedBehaviorSanitizer NO \
            ENABLE_ADDRESS_SANITIZER=NO \
            ENABLE_UNDEFINED_BEHAVIOR_SANITIZER=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/swift-soak.log
          xcb_rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$xcb_rc" -eq 0 ]]; then
            echo "::notice::xcodebuild exited cleanly."
          else
            # Same infra-quirk absorption as ci.yml: trust the test
            # result lines, not the exit code. The sentinel-grep
            # step below is the load-bearing correctness check.
            if grep -q "Test Suite 'Selected tests' passed" /tmp/swift-soak.log \
               && ! grep -qE "Test Case .* failed" /tmp/swift-soak.log; then
              echo "::notice::All test suites passed; xcodebuild exited $xcb_rc due to an infra restart with no per-test failure attributed. Treating as success."
            else
              echo "::error::xcodebuild exited $xcb_rc and either a test failed or the suites didn't report passed."
              exit "$xcb_rc"
            fi
          fi

      - name: Sentinel - verify soak tests actually ran (not skipped)
        # LOAD-BEARING. See the env-propagation hazard in the
        # workflow header. If TEST_RUNNER_BB_RUN_SOAK=1 doesn't
        # reach the xctest host (Xcode regression, scheme rewrite,
        # runner-image drift), the soak tests will SKIP silently
        # via their XCTSkipIf guards and the workflow goes green
        # without exercising the gates it exists to run.
        #
        # xcodebuild emits a deterministic line per executed test:
        #   Test Case '-[BlackbirdTests.<Class> <method>]' passed (X.XXXs).
        # And per-skipped test:
        #   Test Case '-[BlackbirdTests.<Class> <method>]' skipped (X.XXXs).
        # We grep for the `passed` form on the soak test method
        # names. Missing = the soak gates didn't actually run, fail
        # the job loudly so we investigate rather than silently
        # accepting a meaningless green.
        #
        # Why this is more robust than a `print("RSS_BASELINE: ...")`
        # marker in test code: we don't have to touch test code (the
        # test file is in Phase 1 and intentionally landed without
        # this marker; bundling test edits into a CI-only change
        # would muddy the bisect surface), and xcodebuild's `passed`
        # line is documented and stable across Xcode versions.
        #
        # If a soak test name changes, this grep needs an update.
        # That's the right coupling: a renamed test means the
        # workflow's `-only-testing` filter would also be wrong,
        # and both should be updated together.
        run: |
          set -e
          if [[ ! -f /tmp/swift-soak.log ]]; then
            echo "::error::xcodebuild log /tmp/swift-soak.log missing - previous step did not produce expected output."
            exit 1
          fi
          missing=()
          if ! grep -qE "Test Case .*test_terminalSessionDrop_returnsRssToBaseline.*' passed" /tmp/swift-soak.log; then
            missing+=("SwiftSessionRSSReturnsToBaselineTests.test_terminalSessionDrop_returnsRssToBaseline_under20MiB_overTenIterations")
          fi
          if ! grep -qE "Test Case .*test_bbtermDrop_returnsRssToBaseline.*' passed" /tmp/swift-soak.log; then
            missing+=("SwiftSessionRSSReturnsToBaselineTests.test_bbtermDrop_returnsRssToBaseline_under20MiB_overTenIterations")
          fi
          if ! grep -qE "Test Case .*test_soak_10s_feedAndSnapshot.*' passed" /tmp/swift-soak.log; then
            missing+=("BBTermAdversarialTests.test_soak_10s_feedAndSnapshot_underBoundedMemory")
          fi
          if ! grep -qE "Test Case .*test_concurrent_headlessSessions_steadyStateRSS_returnsToBaseline.*' passed" /tmp/swift-soak.log; then
            missing+=("MultiTabConcurrentSoakTests.test_concurrent_headlessSessions_steadyStateRSS_returnsToBaseline")
          fi
          if ! grep -qE "Test Case .*test_concurrent_headlessSessions_mainThreadResponsive.*' passed" /tmp/swift-soak.log; then
            missing+=("MultiTabConcurrentSoakTests.test_concurrent_headlessSessions_mainThreadResponsive")
          fi
          if ! grep -qE "Test Case .*test_singleSession_steadyState_1Mb_no_drift.*' passed" /tmp/swift-soak.log; then
            missing+=("SingleSessionSteadyStateLeakTests.test_singleSession_steadyState_1Mb_no_drift")
          fi
          if ! grep -qE "Test Case .*test_singleSession_steadyState_snapshotChurn_no_drift.*' passed" /tmp/swift-soak.log; then
            missing+=("SingleSessionSteadyStateLeakTests.test_singleSession_steadyState_snapshotChurn_no_drift")
          fi
          # P4.6: real-windowed latency test. We accept EITHER `passed`
          # (the runner has a real display server, the test measured
          # real latency) OR `skipped` (the runner couldn't acquire a
          # CAMetalLayer drawable, the test threw XCTSkip with the
          # "Windowed Metal probe cannot acquire a CAMetalLayer
          # drawable" reason). Both are valid outcomes.
          #
          # What we CANNOT accept is the test never running at all -
          # that would mean TEST_RUNNER_BB_RUN_LATENCY_PROBE didn't
          # reach the xctest host and the env-gated XCTSkipIf at the
          # very top fired with the "BB_RUN_LATENCY_PROBE=1 not set"
          # reason. Inspecting the SKIP REASON is the load-bearing
          # check, and it is an ALLOW-list: a skip is accepted only when
          # its reason line names one of the two host limitations the
          # test throws XCTSkip for (no CAMetalLayer drawable; OSLogStore
          # unreadable). Any other skip reason - the env-gate message,
          # a reworded message after an Xcode upgrade, a new XCTSkip
          # added upstream - is a sentinel violation. (The previous
          # shape matched the env-gate string literally and so failed
          # OPEN whenever the wording drifted.)
          if ! grep -qE "Test Case .*test_realWindowedRender_collectsNonZeroLatencySamples.*' (passed|skipped)" /tmp/swift-soak.log; then
            missing+=("RealLatencyProbeWindowedTests.test_realWindowedRender_collectsNonZeroLatencySamples")
          elif grep -qE "Test Case .*test_realWindowedRender_collectsNonZeroLatencySamples.*' skipped" /tmp/swift-soak.log \
               && ! grep -qE "test_realWindowedRender_collectsNonZeroLatencySamples.*Test skipped - (Windowed Metal probe cannot acquire a CAMetalLayer drawable|OSLogStore not readable)" /tmp/swift-soak.log; then
            # Skipped for a reason we do not allow-list. The env-gate
            # skip (TEST_RUNNER_BB_RUN_LATENCY_PROBE propagation broken)
            # is the silent-green failure mode this sentinel exists to
            # prevent; an unknown reason gets the same treatment.
            missing+=("RealLatencyProbeWindowedTests.test_realWindowedRender_collectsNonZeroLatencySamples (skipped for a reason outside the allow-list - env-gate / TEST_RUNNER_BB_RUN_LATENCY_PROBE propagation, or a reworded XCTSkip; see the skip lines below)")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Soak sentinel FAILED - the following tests did not emit a 'passed' line:"
            for t in "${missing[@]}"; do
              echo "::error::  - $t"
            done
            echo "::error::This usually means TEST_RUNNER_BB_RUN_SOAK / TEST_RUNNER_BB_RUN_LATENCY_PROBE did not reach the xctest host, and the tests skipped via XCTSkipIf - yielding a meaningless green. Investigate Xcode env-propagation regression or scheme drift before merging anything that touches CI."
            echo "::error::Skip lines from log (if any):"
            grep -E "Test Case .*' skipped" /tmp/swift-soak.log >&2 || true
            exit 1
          fi
          echo "::notice::Soak sentinel OK - all soak tests emitted 'passed' markers."

      - name: xcodebuild test - window-lifecycle tests, one process each
        # BB_RUN_WINDOW_LIFECYCLE_TESTS gates eleven real-window tests
        # (MainWindowControllerLifetimeTests x4 incl. the F-S6-001
        # dock-zombie regression, CloseConfirmBypassTests,
        # CoreFailureKeepOpenBlindTests, JoinedTabCloseReleaseBlindTests,
        # CloseSelectedTabNeighborBlindTests x4).
        # They are gated, and so ran in no job, because several real
        # windows / merged tab groups in ONE xctest process crash the
        # host: a close() on a merged window poisons a deferred
        # CATransaction that SEGVs a later test (CLAUDE.md test-authoring
        # rules). Each test passes on its own, so each gets its own
        # xcodebuild process here. Do NOT fold them into the soak step
        # above or into ci.yml's whole-suite run.
        #
        # Runs even when the soak step above failed (a soak flake or RSS
        # drift must not also drop the eleven lifecycle runs for the night);
        # only a cancelled workflow skips it.
        #
        # Same TEST_RUNNER_ env-propagation and ASan-off build settings as
        # the soak step (the build products are reused after the first
        # iteration).
        #
        # Pass / skip policy. A bare "no failed line" is not enough: every
        # one of these tests can XCTSkip on a headless runner (no Metal
        # device, miniaturize honoured by no Dock, no tab-group merge), and
        # a step that treated any skip as success would stay green while the
        # F-S6-001 dock-zombie test never asserted anything. So:
        #   * a test must emit `passed`, OR `skipped` with a reason on its
        #     own ALLOW-LIST (allowed_skip below: the specific host
        #     limitations that test throws XCTSkip for). Any other skip
        #     reason - the env-gate message (TEST_RUNNER_ propagation
        #     broken), a reworded XCTSkip, a skip added later - fails;
        #   * at least one of the eleven must actually pass, so "all eleven
        #     skipped on a runner limitation" cannot go green;
        #   * every allow-listed skip is surfaced as a ::warning:: and in
        #     the step summary, with a passed / skipped tally.
        # A test that skips every night is thereby visible, and a runner
        # change that turns skips into passes needs no edit here.
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_BB_RUN_WINDOW_LIFECYCLE_TESTS: "1"
        run: |
          tests=(
            MainWindowControllerLifetimeTests/test_bandClick_doesNotHijackTabSelection
            MainWindowControllerLifetimeTests/test_deferredAutoClose_miniaturizedWindow_closesZombie
            MainWindowControllerLifetimeTests/test_newWindow_tabbingMode_revertsFromDisallowedAfterCreation
            MainWindowControllerLifetimeTests/test_pillAccessibilityFrame_matchesActualScreenPosition
            CloseConfirmBypassTests/test_windowShouldClose_bypassBranch
            CoreFailureKeepOpenBlindTests/test_keepOpenOnCoreFailureSheet_leavesTheWindowOpen
            JoinedTabCloseReleaseBlindTests/test_tabJoinedViaAddTabbedWindow_isFullyReleasedAfterClose
            CloseSelectedTabNeighborBlindTests/test_closingSelectedMiddleTab_selectsRightNeighbour
            CloseSelectedTabNeighborBlindTests/test_closingSelectedTab_afterDragReorder_selectsVisualNotArrivalNeighbour
            CloseSelectedTabNeighborBlindTests/test_closingSelectedLastPill_afterDragReorder_selectsLeftVisualNeighbour
            CloseSelectedTabNeighborBlindTests/test_closingSelectedLastTab_selectsLeftNeighbour_control
          )

          # ERE of the skip reasons (matched at the START of the reason, after
          # "Test skipped - ") that are a genuine headless-host limitation for
          # the test method $1. Empty = no skip is acceptable.
          allowed_skip() {
            case "$1" in
              test_newWindow_tabbingMode_revertsFromDisallowedAfterCreation | \
              test_windowShouldClose_bypassBranch | \
              test_keepOpenOnCoreFailureSheet_leavesTheWindowOpen)
                echo "no Metal device" ;;
              test_bandClick_doesNotHijackTabSelection)
                echo "no Metal device|headless host refused to form a tab group" ;;
              test_pillAccessibilityFrame_matchesActualScreenPosition)
                echo "no Metal device|headless host refused to form a tab group|headless host produced no pill frames" ;;
              test_deferredAutoClose_miniaturizedWindow_closesZombie)
                echo "no Metal device|headless xctest host did not honor miniaturize" ;;
              test_tabJoinedViaAddTabbedWindow_isFullyReleasedAfterClose)
                echo "no Metal device|xctest host refused the headless addTabbedWindow merge|even a bare TerminalWindow that joined a group|xctest host did not merge the controller's window" ;;
              test_closingSelectedMiddleTab_selectsRightNeighbour | \
              test_closingSelectedTab_afterDragReorder_selectsVisualNotArrivalNeighbour | \
              test_closingSelectedLastPill_afterDragReorder_selectsLeftVisualNeighbour | \
              test_closingSelectedLastTab_selectsLeftNeighbour_control)
                echo "no Metal device|xctest host refused the headless addTabbedWindow merge" ;;
              *) echo "" ;;
            esac
          }

          : > /tmp/swift-lifecycle.log
          bad=()
          passed=()
          skipped=()
          for t in "${tests[@]}"; do
            m="${t#*/}"
            one=/tmp/swift-lifecycle-one.log
            : > "$one"
            set +e
            xcodebuild test \
              -project Blackbird.xcodeproj \
              -scheme Blackbird \
              -destination "platform=macOS,arch=arm64" \
              -only-testing:BlackbirdTests/"$t" \
              -enableAddressSanitizer NO \
              -enableUndefinedBehaviorSanitizer NO \
              ENABLE_ADDRESS_SANITIZER=NO \
              ENABLE_UNDEFINED_BEHAVIOR_SANITIZER=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              2>&1 | tee "$one"
            xcb_rc="${PIPESTATUS[0]}"
            set -e
            cat "$one" >> /tmp/swift-lifecycle.log
            if [[ "$xcb_rc" -ne 0 ]]; then
              bad+=("$t (xcodebuild exited $xcb_rc)")
            elif grep -qE "Test Case .*${m}.*' passed" "$one"; then
              passed+=("$t")
            elif grep -qE "Test Case .*${m}.*' skipped" "$one"; then
              allow="$(allowed_skip "$m")"
              reason="$(grep -E "${m}.*Test skipped - " "$one" | head -1 | sed 's/.*Test skipped - //' || true)"
              if [[ -n "$allow" ]] && grep -qE "${m}.*Test skipped - (${allow})" "$one"; then
                skipped+=("$t: $reason")
              else
                bad+=("$t (skipped for a reason outside its allow-list - env-gate / TEST_RUNNER_BB_RUN_WINDOW_LIFECYCLE_TESTS propagation, or a reworded XCTSkip: '${reason:-<no reason line>}')")
              fi
            else
              bad+=("$t (no passed/skipped line)")
            fi
          done

          if (( ${#passed[@]} == 0 )); then
            bad+=("none of the ${#tests[@]} window-lifecycle tests passed - every one failed or skipped, so this step asserted nothing")
          fi

          {
            echo "### Window-lifecycle tests: ${#passed[@]} passed, ${#skipped[@]} skipped on a runner limitation, ${#bad[@]} problem(s)"
            for p in "${passed[@]}"; do echo "- passed: $p"; done
            for s in "${skipped[@]}"; do echo "- skipped: $s"; done
            for b in "${bad[@]}"; do echo "- PROBLEM: $b"; done
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          for s in "${skipped[@]}"; do
            echo "::warning::Window-lifecycle test skipped on a runner limitation (it asserted nothing tonight): $s"
          done
          if (( ${#bad[@]} > 0 )); then
            echo "::error::Window-lifecycle tests FAILED:"
            for b in "${bad[@]}"; do echo "::error::  - $b"; done
            exit 1
          fi
          echo "::notice::Window-lifecycle tests: ${#passed[@]} passed, ${#skipped[@]} skipped on an allow-listed runner limitation (of ${#tests[@]})."

      - name: Upload test logs on failure
        # Same shape as ci.yml's xcode-test-logs step: keep DerivedData
        # test logs available for 7 days when a soak fails so we can
        # inspect xctest-host crash logs / per-iteration RSS samples
        # without re-running. Also include /tmp/swift-soak.log so the
        # raw xcodebuild output (which our sentinel grep reads) is
        # preserved for post-mortem.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-soak-logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test
            /tmp/swift-soak.log
            /tmp/swift-lifecycle.log
          if-no-files-found: ignore
          retention-days: 7
