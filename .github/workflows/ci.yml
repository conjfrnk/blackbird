name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-wide: read-only. No CI job needs write access — CI is pure
# verification (build, test, fuzz smoke, latency/memory gates). A
# compromised third-party action can therefore not push, comment, or
# create releases even if exploited.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, test (debug + release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p blackbird_core --all-targets -- -D warnings

      - name: test (debug)
        run: cargo test -p blackbird_core --lib --tests

      - name: test (release)
        run: cargo test -p blackbird_core --lib --tests --release

      - name: audit (RustSec advisories)
        # `cargo audit` checks every transitive dep in Cargo.lock against
        # the RustSec advisory database. Runs after tests so a new
        # advisory doesn't block unrelated signal — but still blocks
        # merges: a known-vulnerable dep is always a PR blocker (audit
        # rust-build F10). `--deny warnings` promotes yanked-crate
        # warnings to errors; the lockfile is already strict-version.
        run: |
          cargo install cargo-audit --locked --version "^0.22" || true
          cargo audit --deny warnings

      - name: deny (license + dep policy)
        # `cargo deny` complements `cargo audit`. Audit catches KNOWN
        # vulnerabilities; deny catches license drift, unknown-source
        # deps (git-URLs, private registries), and accidental dep
        # duplication. Config in deny.toml. `bans licenses sources`
        # only — advisories are already covered by cargo-audit, and
        # the advisory DB's CVSS v4 entries aren't parseable by this
        # version of cargo-deny. Pinned to 0.18.3 for rust 1.85
        # toolchain; bump when rust-version.workspace bumps.
        run: |
          cargo install cargo-deny --locked --version "=0.18.3" || true
          cargo deny check bans licenses sources

  xcode:
    name: Xcode — build + test
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Regenerate + fail if the committed pbxproj drifted from what
        # project.yml describes. Audit xcode-project F1 — the pbxproj is
        # tracked in git AND auto-generated; without a drift gate a PR
        # that updates only pbxproj and not project.yml (or vice versa)
        # merges fine and silently diverges the two.
        run: |
          xcodegen generate
          if ! git diff --quiet -- Blackbird.xcodeproj/project.pbxproj; then
            echo "error: Blackbird.xcodeproj/project.pbxproj drifted from project.yml —" >&2
            echo "       re-run \`xcodegen generate\` locally and commit the diff." >&2
            git --no-pager diff -- Blackbird.xcodeproj/project.pbxproj >&2
            exit 1
          fi

      - name: Build Rust core (universal)
        run: scripts/build-core.sh

      # The Blackbird scheme enables ASan + UBSan in its test action
      # (project.yml:181-187). On macos-14 GHA, the cumulative ASan
      # instrumentation overhead at xctest-bundle load time exceeds the
      # per-process VM-mapping ceiling once the suite reached 900+ tests
      # in the v0.1.9 hardening sweep. We chased eight whack-a-mole
      # fixes (test-thread serialisation, MallocNanoZone=0, ASAN_OPTIONS
      # tuning, gating heavy iteration tests, alphabetical batch split)
      # — each shifted the symptom but the runner kept tipping the wall
      # at xctest startup ("nano zone abandoned" → restart loop →
      # xcodebuild aggregate-fail even when tests passed on retry).
      #
      # Pragmatic resolution: disable ASan/UBSan on PR CI by overriding
      # the build settings on the command line. The scheme STAYS
      # configured for ASan so local dev runs in Xcode keep full
      # sanitiser coverage; only this CI invocation opts out.
      #
      # Coverage retained without ASan in this job:
      #  - Rust: long-session memory gate, parser throughput gate, fmt /
      #    clippy / debug + release tests, fuzz smoke (covers the FFI
      #    surface and core memory invariants).
      #  - Security posture entitlement / hardened-runtime audit.
      #  - Release-config Xcode build (catches Swift type errors and
      #    universal-binary regressions).
      #  - Smoke test (launch + 3 s + SIGTERM).
      #
      # Reintroducing ASan on this job will require either splitting the
      # Swift test target into multiple binaries or moving ASan to a
      # nightly job with a curated subset.
      - name: xcodebuild build + test
        run: |
          # ENABLE_ADDRESS_SANITIZER=NO overrides the scheme's ASan
          # setting at the BUILD step (the -enableAddressSanitizer
          # xcodebuild flag only governs the test action's runtime,
          # not what's baked into the binary). Without this the linker
          # still emits `-fsanitize=address` and the test-host launches
          # with ASan instrumentation regardless of the runtime flag.
          #
          # The `set +e` / result-based check absorbs an infra quirk
          # that surfaced when the suite hit ~900 tests: the test-host
          # process occasionally exits unexpectedly mid-run, xctest
          # restarts it cleanly, all suites pass on the restart — but
          # xcodebuild still exits 65, attributing the original launch
          # crash to a phantom 'failing test' (the Failing tests:
          # header is empty in the output). When BlackbirdTests.xctest
          # reports "passed" we trust it; otherwise we propagate the
          # failure.
          set +e
          xcodebuild test \
            -project Blackbird.xcodeproj \
            -scheme Blackbird \
            -destination "platform=macOS,arch=arm64" \
            -enableAddressSanitizer NO \
            -enableUndefinedBehaviorSanitizer NO \
            ENABLE_ADDRESS_SANITIZER=NO \
            ENABLE_UNDEFINED_BEHAVIOR_SANITIZER=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/xcodebuild_test.log
          xcb_rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$xcb_rc" -eq 0 ]]; then
            echo "::notice::xcodebuild exited cleanly."
            exit 0
          fi
          if grep -q "Test Suite 'BlackbirdTests.xctest' passed" /tmp/xcodebuild_test.log \
             && grep -q "Test Suite 'Selected tests' passed" /tmp/xcodebuild_test.log \
             && ! grep -qE "Test Case .* failed" /tmp/xcodebuild_test.log; then
            echo "::notice::All test suites passed on retry; xcodebuild exited $xcb_rc due to an infra restart with no per-test failure attributed. Treating as success."
            exit 0
          fi
          echo "::error::xcodebuild exited $xcb_rc and either a test failed or the suites didn't both report passed."
          exit "$xcb_rc"

      - name: Test-quality lint (ratchet)
        # Flags low-signal `XCTAssertNotNil(singleObject)` / Rust
        # `.is_some()` assertions that tend to pass for the wrong
        # reason. Ratchets against `.test-lint-baseline` so we can't
        # add new ones without explicit justification. Audit K5.
        run: scripts/lint-tests.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-logs-${{ github.run_id }}
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test
          if-no-files-found: ignore
          retention-days: 7

  latency-gate:
    name: Latency gate — p50/p99 regression check
    runs-on: macos-14
    needs: xcode
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Regenerate + fail if the committed pbxproj drifted from what
        # project.yml describes. Audit xcode-project F1 — the pbxproj is
        # tracked in git AND auto-generated; without a drift gate a PR
        # that updates only pbxproj and not project.yml (or vice versa)
        # merges fine and silently diverges the two.
        run: |
          xcodegen generate
          if ! git diff --quiet -- Blackbird.xcodeproj/project.pbxproj; then
            echo "error: Blackbird.xcodeproj/project.pbxproj drifted from project.yml —" >&2
            echo "       re-run \`xcodegen generate\` locally and commit the diff." >&2
            git --no-pager diff -- Blackbird.xcodeproj/project.pbxproj >&2
            exit 1
          fi

      - name: Build Rust core (universal)
        run: scripts/build-core.sh

      - name: Latency gate
        run: LATENCY_P50_MS=6.0 LATENCY_P99_MS=20.0 scripts/bench-latency.sh

  swift-release-universal:
    name: Xcode — Release build (arm64 + x86_64 universal)
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Regenerate + fail if the committed pbxproj drifted from what
        # project.yml describes. Audit xcode-project F1 — the pbxproj is
        # tracked in git AND auto-generated; without a drift gate a PR
        # that updates only pbxproj and not project.yml (or vice versa)
        # merges fine and silently diverges the two.
        run: |
          xcodegen generate
          if ! git diff --quiet -- Blackbird.xcodeproj/project.pbxproj; then
            echo "error: Blackbird.xcodeproj/project.pbxproj drifted from project.yml —" >&2
            echo "       re-run \`xcodegen generate\` locally and commit the diff." >&2
            git --no-pager diff -- Blackbird.xcodeproj/project.pbxproj >&2
            exit 1
          fi

      - name: Build Rust core (universal)
        run: scripts/build-core.sh

      - name: xcodebuild build (Release, universal)
        run: |
          xcodebuild build \
            -project Blackbird.xcodeproj \
            -scheme Blackbird \
            -configuration Release \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify universal binary
        run: |
          set -euo pipefail
          DD="$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 1 -type d -name 'Blackbird-*' | head -1)"
          BIN="$DD/Build/Products/Release/Blackbird.app/Contents/MacOS/Blackbird"
          file "$BIN"
          lipo -info "$BIN" | tee /tmp/lipo.out
          grep -Eq 'arm64 x86_64|x86_64 arm64' /tmp/lipo.out

  smoke:
    name: Smoke — launch, 3s, SIGTERM
    runs-on: macos-14
    needs: xcode
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Regenerate + fail if the committed pbxproj drifted from what
        # project.yml describes. Audit xcode-project F1 — the pbxproj is
        # tracked in git AND auto-generated; without a drift gate a PR
        # that updates only pbxproj and not project.yml (or vice versa)
        # merges fine and silently diverges the two.
        run: |
          xcodegen generate
          if ! git diff --quiet -- Blackbird.xcodeproj/project.pbxproj; then
            echo "error: Blackbird.xcodeproj/project.pbxproj drifted from project.yml —" >&2
            echo "       re-run \`xcodegen generate\` locally and commit the diff." >&2
            git --no-pager diff -- Blackbird.xcodeproj/project.pbxproj >&2
            exit 1
          fi

      - name: Build Rust core (universal)
        run: scripts/build-core.sh

      - name: Build Debug
        run: |
          xcodebuild build \
            -project Blackbird.xcodeproj \
            -scheme Blackbird \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run smoke
        # The smoke script re-signs the built .app with an `Apple Development`
        # identity before launch — hardened-runtime + ad-hoc = dyld rejects
        # the launch on a dev machine (the v0.1.0 repro vector). CI has no
        # such identity in its keychain and doesn't need it (the runner
        # launches the binary inside a fresh session); BB_SKIP_RESIGN=1 skips
        # the re-sign step without weakening the dev-machine default.
        env:
          BB_SKIP_RESIGN: "1"
        run: scripts/smoke.sh

  rust-fuzz-smoke:
    name: Rust — fuzz smoke (30s/target)
    runs-on: macos-14
    # Blocking. Corpus is stable; a new crash here should fail the build so we
    # fix it rather than accumulating latent bugs. If a flake emerges, prefer
    # shrinking + committing the offending input to corpus/ over reintroducing
    # continue-on-error.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (cargo-fuzz needs nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core/fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Short fuzz each target
        working-directory: core/fuzz
        run: |
          set -euo pipefail
          TARGETS="$(cargo fuzz list)"
          if [ -z "$TARGETS" ]; then
            echo "No fuzz targets defined — skipping."
            exit 0
          fi
          for target in $TARGETS; do
            echo "==> fuzzing $target for 30s"
            # -max_len 16384: bound per-input at 16 KiB so the fuzzer
            # doesn't mutate toward multi-MB payloads that exhaust the
            # 30 s budget on one testcase. 16 KiB is comfortably larger
            # than the committed OSC 8 oversize seed (8 KiB).
            # -rss_limit_mb 2048: cap total fuzzer RSS at 2 GiB so a
            # runaway-allocation bug surfaces as an libFuzzer-caught OOM
            # rather than a GHA OOM kill (which is harder to reproduce).
            cargo fuzz run "$target" -- \
              -max_total_time=30 \
              -max_len=16384 \
              -rss_limit_mb=2048
          done

  rust-throughput:
    name: Rust — parser throughput gate
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # --ignored picks up core/tests/throughput.rs, which is hidden from the
      # default `cargo test` run (release-only regression gate, not a
      # correctness check). Failing here means parser throughput dropped below
      # the documented floor.
      - name: Run throughput gate
        run: cargo test -p blackbird_core --test throughput --release -- --ignored --nocapture

  rust-memory:
    name: Rust — long-session memory gate
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Asserts the new/input/snap/free and snapshot-churn loops don't leak
      # by measuring RSS via mach_task_basic_info. An actual leak shows up
      # as RSS growth scaling with iterations; this gate catches that.
      - name: Run long-session memory gate
        # --test-threads=1: tests share process RSS; parallel execution
        # cross-contaminates measurements (false 100% leak signal). Serial
        # makes the absolute 32 MiB cap + delta-of-deltas ratio gate
        # deterministic.
        run: cargo test -p blackbird_core --test long_session_memory --release -- --ignored --nocapture --test-threads=1

  rust-resources:
    name: Rust — long-session FD + thread gate
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Sibling gate to rust-memory above: that one watches RSS, this one
      # watches non-memory OS handles. A regression that mem::forgets a
      # File or spawns a worker thread per BBTerm wouldn't necessarily
      # show up as RSS growth in 128 iterations, but would burn FDs /
      # threads cycle by cycle until the process hits ulimit -n or a
      # thread cap mid-session. Asserts return-to-baseline (modulo small
      # absolute slop) across 1024 bb_term_new/free cycles.
      - name: Run long-session FD + thread gate
        # --test-threads=1: parallel runs would contaminate the
        # process-wide FD table and thread list (the very things we
        # measure); serial keeps absolute caps deterministic.
        run: cargo test -p blackbird_core --test long_session_resources --release -- --ignored --nocapture --test-threads=1

  security-posture:
    name: Security posture — entitlements + hardened runtime
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Pins hardened runtime on, refuses any com.apple.security.cs.disable-*
      # entitlement, and confirms the release pipeline still targets
      # Developer ID + notarytool. Fast — pure static checks against
      # project.yml / scripts / Sources.
      - name: Check security posture
        run: scripts/check-security-posture.sh
