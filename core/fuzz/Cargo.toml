[package]
name = "blackbird_core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

# The fuzz crate is its OWN workspace (cargo-fuzz convention), so the
# root workspace's [patch.crates-io] does NOT apply here — without this
# mirror patch, `alacritty_terminal` resolved from crates.io and the
# fuzz targets silently fuzzed the UNPATCHED upstream parser instead of
# the vendored fork (masked until the fork grew API that
# blackbird_core calls; then the fuzz build broke on CI). Keep in sync
# with the root Cargo.toml's patch.
[patch.crates-io]
alacritty_terminal = { path = "../../vendor/alacritty_terminal" }

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.blackbird_core]
path = ".."

[[bin]]
name = "fuzz_term_input"
path = "fuzz_targets/fuzz_term_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_text_range"
path = "fuzz_targets/fuzz_text_range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_reply_storm"
path = "fuzz_targets/fuzz_reply_storm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_resize2"
path = "fuzz_targets/fuzz_resize2.rs"
test = false
doc = false
bench = false
