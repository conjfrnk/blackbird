[package]
name = "blackbird_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Rust VT parser core for the Blackbird terminal emulator."

[lib]
name = "blackbird_core"
crate-type = ["staticlib", "rlib"]

[features]
test-only = []

[dependencies]
# default-features off: the only default is `serde`, and core never
# (de)serializes alacritty/vte types (it snapshots through its own FFI structs).
alacritty_terminal = { version = "=0.26.0", default-features = false }
# SIMD byte search for the `ESC[2J` augmentation fast path in bb_term_input.
# Already transitively in the tree (alacritty uses it), so no new weight.
memchr = "2"
# Same crate (and requirement) alacritty_terminal's `Term::input` sizes each
# printed char with; `bb_scalar_cell_width` exposes it so Swift never keeps a
# parallel width table. One version in the lockfile, so the two cannot drift.
unicode-width = "0.2.0"

[build-dependencies]
# cbindgen patch-pinned so a 0.27.x → 0.28 bump doesn't silently reshape
# the generated C header on `cargo update`. Audit rust-build F4. The
# workspace lockfile already fixes the exact version in practice, but
# this makes the floor explicit for consumers without the lockfile.
cbindgen = "=0.27.0"

[dev-dependencies]
# Property-based testing for FFI invariants (parse idempotence over split
# points, snapshot diff round-trip, mode set/reset, scroll roundtrip).
# 1.x range — semver-compatible patches/minors are accepted; cargo deny's
# `wildcards = "deny"` rule allows numeric-prefix requirements like "1".
# default-features off drops `fork` (rusty-fork/tempfile) and `timeout`
# (wait-timeout); no test sets ProptestConfig `fork`/`timeout`.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
