language = "C"
header = "// Generated by cbindgen. DO NOT EDIT."
include_guard = "BLACKBIRD_CORE_H"
cpp_compat = true
style = "tag"
documentation = true
documentation_style = "doxy"
no_includes = false
sys_includes = ["stddef.h"]

[export]
include = ["BBTerm", "BBSnap", "BBCell", "BBEvent", "BBEventKind", "BBString", "BBResizeResult", "BBSyncStatus", "BBPromptMarkKind", "cell_flags", "bb_mode"]
exclude = ["bb_term_test_only_panic"]
prefix = ""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
