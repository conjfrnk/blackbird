[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# alacritty_terminal 0.26.0 declares rust-version = "1.85.0", setting the floor.
rust-version = "1.85"

# Release profile for the statically-linked core lib. Defaults (LTO off,
# codegen-units = 16, no strip) left ~1.2 MiB of debug info in the
# universal .a; thin LTO + single codegen unit gets the blackbird_core
# object to ~400 KiB without measurable throughput regression on the
# VTE parser hot path (throughput gate covers this). `strip = "symbols"`
# keeps names out of the shipped binary. panic = "unwind" is NOT
# flipped — `guard_with_term` / `guard_with_snap` rely on catch_unwind
# to route panics through `BBEventKind::Fatal`; panic = "abort" would
# regress that safety property. Audit rust-build F2.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# In-tree fork of the pinned alacritty_terminal 0.26.0 (same version, so the
# `=0.26.0` requirement in core/Cargo.toml still resolves). Step 1 vendors it
# UNCHANGED under vendor/; the emoji-presentation (VS16 / keycap) cell-width
# patch — which gives `string-width` parity so Claude Code's inline redraw
# math stops drifting — lands on top of this fork. A path patch keeps the
# crate's source local (no new registry/git source for `cargo deny check
# sources`). Re-vendor from the registry + re-apply the patch on any bump.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
# In-tree fork of vte 0.15.0 (a transitive dep of alacritty_terminal). Same
# version, so the resolver still accepts it. Vendored to fix two parser bugs
# the upstream crate carries (tracked in KNOWN_ISSUES): (1) the OSC payload
# `osc_raw: Vec<u8>` had NO cap under the `std` feature (the `is_full()` guard
# is gated `#[cfg(not(feature = "std"))]`), so an unterminated OSC grew without
# bound — a memory DoS; (2) parser-state byte-drop across feed split
# boundaries. Re-vendor from the registry + re-apply the patches on any bump.
vte = { path = "vendor/vte" }
